
    <!DOCTYPE html>
    <html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta name="apple-mobile-web-app-title" content="Work Log">
        
        <title>Arbeitszeit Cockpit</title>
        <style>
            :root { --text-main: #1d1d1f; --text-muted: #86868b; --glass-bg: rgba(255, 255, 255, 0.22); --glass-border: rgba(255, 255, 255, 0.4); }
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { height: 100%; margin: 0; padding: 0; }
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); display: flex; justify-content: center; align-items: center; overflow: hidden; }
            
            /* Anpassung für iPhone Notch / Dynamic Island */
            .glass-panel {
                width: 100%; height: 100vh;
                background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
                display: flex; flex-direction: column; position: relative; overflow: hidden; 
                padding: env(safe-area-inset-top) 25px 25px 25px; /* iOS Safe Area */
            }
            
            .global-stats { text-align: center; margin-bottom: 15px; margin-top: 10px; }
            .global-hours { font-size: 46px; font-weight: 700; letter-spacing: -1.5px; color: var(--text-main); line-height: 1; }
            .global-label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.8px; }

            .segmented-control { position: relative; display: flex; background: rgba(0, 0, 0, 0.06); border-radius: 14px; padding: 3px; margin-bottom: 20px; border: 0.5px solid rgba(255, 255, 255, 0.2); }
            .control-btn { flex: 1; border: none; background: none; padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--text-main); cursor: pointer; z-index: 2; }
            .slider-pill { position: absolute; top: 3px; left: 3px; width: calc(33.333% - 4px); height: calc(100% - 6px); background: rgba(255, 255, 255, 0.7); box-shadow: 0 3px 8px rgba(0,0,0,0.08); border-radius: 11px; z-index: 1; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

            .view-container { flex: 1; position: relative; width: 100%; }
            .main-view { position: absolute; width: 100%; height: 100%; top: 0; left: 0; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transform: scale(0.97); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease; }
            .main-view.active-view { opacity: 1; pointer-events: auto; transform: scale(1); }

            .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; background: rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.2); }
            .cal-header { text-align: center; font-size: 10px; font-weight: 700; color: var(--text-muted); padding-bottom: 5px; }
            .cal-cell { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: 500; color: var(--text-main); border-radius: 50%; }
            .cal-cell.has-work { background: rgba(0, 122, 255, 0.22); border: 1.5px solid rgba(0, 122, 255, 0.4); color: #004999; font-weight: 700; cursor: pointer; }
            .cal-cell.empty { opacity: 0.15; }
            .calendar-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; padding-left: 5px; color: var(--text-main); }

            .week-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 4px; padding-bottom: 40px; }
            .week-row { background: rgba(255, 255, 255, 0.2); padding: 12px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; gap: 6px; }
            .week-row-meta { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-main); }
            .timeline-track { height: 18px; background: rgba(0, 0, 0, 0.04); border-radius: 6px; position: relative; overflow: hidden; }
            .timeline-bar { position: absolute; height: 100%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); border-radius: 4px; }
            .timeline-labels { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); padding: 0 2px; }

            .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
            .nav-btn { background: rgba(255, 255, 255, 0.3); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 13px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
            .nav-btn:disabled { opacity: 0.2; cursor: default; }
            .day-date-title { font-size: 15px; font-weight: 600; }
            .category-bars { margin-bottom: 15px; }
            .cat-row { display: flex; align-items: center; margin-bottom: 8px; }
            .cat-label { width: 80px; font-size: 12px; font-weight: 600; }
            .bar-bg { flex: 1; height: 10px; background: rgba(255, 255, 255, 0.25); border-radius: 5px; overflow: hidden; margin: 0 10px; }
            .bar-fill { height: 100%; background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%); border-radius: 5px; }
            .cat-time { width: 50px; text-align: right; font-size: 11px; font-weight: 600; }
            .entries-list { flex: 1; overflow-y: auto; padding-bottom: 40px; }
            .entry-card { background: rgba(255, 255, 255, 0.35); border-radius: 14px; padding: 12px 15px; margin-bottom: 8px; border: 0.5px solid rgba(255, 255, 255, 0.2); }
            .entry-card-header { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
            .entry-card-desc { font-size: 11.5px; color: #2c2c2e; line-height: 1.4; }
        </style>
    </head>
    <body>

    <div class="glass-panel">
        <div class="global-stats">
            <div class="global-hours" id="render-global-total">17h 45m</div>
            <div class="global-label" id="stats-label">Arbeitszeit im Juli 2026</div>
        </div>

        <div class="segmented-control">
            <div class="slider-pill" id="pill"></div>
            <button class="control-btn" onclick="uiSwitchView('month', 0)">Monat</button>
            <button class="control-btn" onclick="uiSwitchView('week', 1)">Woche</button>
            <button class="control-btn" onclick="uiSwitchView('day', 2)">Tag</button>
        </div>

        <div class="view-container">
            <div class="main-view active-view" id="view-month">
                <div class="calendar-title">Juli 2026</div>
                <div class="calendar-grid" id="calendar-wrapper">
                    <div class="cal-header">MO</div><div class="cal-header">DI</div><div class="cal-header">MI</div>
                    <div class="cal-header">DO</div><div class="cal-header">FR</div><div class="cal-header">SA</div><div class="cal-header">SO</div>
                    <div class="cal-cell empty"></div><div class="cal-cell empty"></div><div class="cal-cell">1</div><div class="cal-cell">2</div><div class="cal-cell">3</div><div class="cal-cell">4</div><div class="cal-cell">5</div><div class="cal-cell has-work" onclick="forceDayView('2026-07-06')">6</div><div class="cal-cell has-work" onclick="forceDayView('2026-07-07')">7</div><div class="cal-cell has-work" onclick="forceDayView('2026-07-08')">8</div><div class="cal-cell has-work" onclick="forceDayView('2026-07-09')">9</div><div class="cal-cell">10</div><div class="cal-cell">11</div><div class="cal-cell">12</div><div class="cal-cell">13</div><div class="cal-cell">14</div><div class="cal-cell">15</div><div class="cal-cell">16</div><div class="cal-cell">17</div><div class="cal-cell">18</div><div class="cal-cell">19</div><div class="cal-cell">20</div><div class="cal-cell">21</div><div class="cal-cell">22</div><div class="cal-cell">23</div><div class="cal-cell">24</div><div class="cal-cell">25</div><div class="cal-cell">26</div><div class="cal-cell">27</div><div class="cal-cell">28</div><div class="cal-cell">29</div><div class="cal-cell">30</div><div class="cal-cell">31</div>
                </div>
            </div>

            <div class="main-view" id="view-week">
                <div class="week-list" id="week-rows-wrapper"></div>
            </div>

            <div class="main-view" id="view-day">
                <div class="day-header">
                    <button class="nav-btn" id="btn-prev" onclick="changeDay(-1)">&#10094;</button>
                    <div class="day-date-title" id="day-title">Datum</div>
                    <button class="nav-btn" id="btn-next" onclick="changeDay(1)">&#10095;</button>
                </div>
                <div id="day-categories-wrapper"></div>
                <div class="entries-list" id="day-entries-wrapper"></div>
            </div>
        </div>
    </div>

    <script>
        const logData = {"2026-07-06": {"total_minutes": 170.0, "categories": {"Hardware": 170.0}, "entries": [{"start": "14:00", "end": "16:50", "start_min": 840, "end_min": 1010, "category": "Hardware", "desc": "Anfang Testaufbau, AOD auf Mikrometertisch schrauben mit der richtigen H\u00f6he", "duration": 170.0}]}, "2026-07-07": {"total_minutes": 310.0, "categories": {"Hardware": 310.0}, "entries": [{"start": "11:10", "end": "12:40", "start_min": 670, "end_min": 760, "category": "Hardware", "desc": "\u00dcberlegung weiteres Vorgehen beim Setup", "duration": 90.0}, {"start": "13:40", "end": "17:20", "start_min": 820, "end_min": 1040, "category": "Hardware", "desc": "l\u00e4ngeres SMA Kabel f\u00fcr Verbindung zwischen RF Amplifier und AOD, Lambda Halbe Platte vor AOD ausgetauscht (jetzt f\u00fcr 850 nm geeignet); Bene hat die 25.4 mm Linse in ein schraubbares Linsengeh\u00e4use eingebaut; Problem bei der AOD Justage: Der Strahl nach dem AOD wird eben abgelenkt und demensprechend die Linse danach nicht entlang der optischen Achse positioniert werden kann. Die optischen Achsen sind eben durch die Schraubenl\u00f6cher des Breadboard vorgegeben, da nur dort die Translationsmikrometerverschiebetische befestigt werden k\u00f6nnen. Wir d\u00fcrfen also mit keinem Winkel in die Linse eintreten, der von der optischen Achse abweicht.", "duration": 220.0}]}, "2026-07-08": {"total_minutes": 285.0, "categories": {"Aufr\u00e4umen": 80.0, "Hardware": 205.0}, "entries": [{"start": "10:00", "end": "11:20", "start_min": 600, "end_min": 680, "category": "Aufr\u00e4umen", "desc": "Aufr\u00e4umen des Tisches, den Bene f\u00fcr seine Bachelorarbeit verwendet hat, um Platz f\u00fcr das zweite Breadboard zu haben", "duration": 80.0}, {"start": "14:00", "end": "17:25", "start_min": 840, "end_min": 1045, "category": "Hardware", "desc": "Einbau des zweiten Breadboards; Befestigung mit Metallabstandshaltern. Positionierung der zweiten Linse auf das neue Breadboard -> Mikrometertisch montieren, AOD und erste Linse jeweils auf ihren Mikrometertischen auf dem ersten Breadboard festschrauben. Nach Kollimatorlinse jetzt ein Spiegel, dann Beam Splitter und dann zweiter Spiegel, Lambda-Halbe-Platte (850 nm), AOD, 1. Linse, 2. Linse, Spiegel, Objektiv, Glasplatte. Das schwierige an dem Einbau des AOD ist, dass wir", "duration": 205.0}]}, "2026-07-09": {"total_minutes": 300.0, "categories": {"Hardware": 300.0}, "entries": [{"start": "11:10", "end": "12:20", "start_min": 670, "end_min": 740, "category": "Hardware", "desc": "AOD neu justieren", "duration": 70.0}, {"start": "13:20", "end": "17:10", "start_min": 800, "end_min": 1030, "category": "Hardware", "desc": "Beamsplitter (PBS) zwischen Spiegel und Lambda Halbe Platte gepackt, umgelenkt mit zwei Spiegeln zu gro\u00dfem Non polarizing Beam Splitter vor der gro\u00dfen Linse -> das ist der kleine Strahl, den Bene dann verwendet hat, um das Objektiv zu justieren, da der Strahl nach dem Passieren der zweiten Linse stark vergr\u00f6\u00dfert ist und damit nicht mehr pr\u00e4zise justiert werden kann. Man k\u00f6nnte auch die Linsen einfach rausschrauben, was bei Bene nicht ging, da er die kleine Linse noch nicht in eine schraubbare Halterung gebaut hat, sondern die war eben in einem Halter, den man in den Sockel reindrehen muss und somit beim Rausdrehen zwangsl\u00e4ufig die Ausrichtung also den Winkel zum Strahl beim Wiederhereindrehen ver\u00e4ndern k\u00f6nnte, was das Alignment etwas zerst\u00f6rt. Bei uns k\u00f6nnten wir auch die Linsen herausschrauben und auf den extra Pfad verzichten; Beim Herausschrauben und Wiederhereinschrauben k\u00f6nnten nat\u00fcrlich minimale Verschiebungen der urspr\u00fcnglichen Positionen auftreten, diese sollten bei vorsichtigem Vorgehen aber eigentlich nicht allzu gro\u00df sein, da der Mikrometertisch festgeschraubt ist auf dem Breadboard und die Schraube f\u00fcr die Position bzw. eher die Feder, die den Schlitten h\u00e4lt, sich nicht so leicht ver\u00e4ndert. Ich musste dann nat\u00fcrlich wieder den AOD neu justieren mit den zwei Umlenkspiegeln davor. Erst als der Strahl dann perfekt durch die Irisblenden an Stelle der Linsen ging, haben wir die Beam Splitter eingesetzt, sodass das Signal maximal ist. Das Objektiv haben wir auch noch justiert, indem wir den kleinen Strahl mit einem Umlenkspiegel auf den Spiegel vor dem Objektiv justiert haben ins Zentrum und dann mit dem Spiegel auf dem Objektiv den Laser auf den Spiegel in den Punkt des eintreffenden Strahl justiert haben. Dann kann man mit dem Spiegel den Strahl auf die gleiche Position des einkommenden Strahls bei der Linse justieren, sodass die auch noch perfekt \u00fcberlappen. So erreicht man dann die R\u00fcckkopplung und kann mit Beamwalking des Objektivspiegels und des Umlenkspiegels feinjustieren.", "duration": 230.0}]}};
        const dates = ["2026-07-06", "2026-07-07", "2026-07-08", "2026-07-09"];
        let currentDayIndex = dates.length - 1; 

        function formatHours(minutes) {
            const h = Math.floor(minutes / 60);
            const m = Math.round(minutes % 60);
            return h + "h " + m + "m";
        }

        function formatDayDate(dateString) {
            const parts = dateString.split('-');
            const d = new Date(parts[0], parts[1] - 1, parts[2]);
            const days = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
            const months = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
            return days[d.getDay()] + " " + parts[2] + ". " + months[d.getMonth()];
        }

        function updateDynamicCounter(viewId) {
            const totalDisplay = document.getElementById('render-global-total');
            const label = document.getElementById('stats-label');
            if (viewId === 'month') {
                let sum = 0;
                for (let date in logData) if (date.indexOf('2026-07') === 0) sum += logData[date].total_minutes;
                totalDisplay.innerText = formatHours(sum);
                label.innerText = "Arbeitszeit im Juli 2026";
            } 
            else if (viewId === 'week') {
                let sum = 0;
                for (let date in logData) sum += logData[date].total_minutes;
                totalDisplay.innerText = formatHours(sum);
                label.innerText = "Gesamte Arbeitszeit der Woche";
            } 
            else if (viewId === 'day') {
                const dStr = dates[currentDayIndex];
                if (dStr && logData[dStr]) {
                    totalDisplay.innerText = formatHours(logData[dStr].total_minutes);
                    label.innerText = "Arbeitszeit am " + formatDayDate(dStr);
                }
            }
        }

        function uiSwitchView(viewId, index) {
            document.getElementById('pill').style.transform = "translateX(" + (index * 100) + "%)";
            const views = document.querySelectorAll('.main-view');
            for(let i = 0; i < views.length; i++) views[i].classList.remove('active-view');
            document.getElementById('view-' + viewId).classList.add('active-view');
            updateDynamicCounter(viewId);
        }

        function forceDayView(dateStr) {
            currentDayIndex = dates.indexOf(dateStr);
            renderDayView();
            uiSwitchView('day', 2);
        }

        function initWeekTimeline() {
            const wrapper = document.getElementById('week-rows-wrapper');
            for(let i=0; i<dates.length; i++) {
                const dateStr = dates[i];
                const dayObj = logData[dateStr];
                const row = document.createElement('div');
                row.className = 'week-row';
                let bars = '';
                for(let j=0; j<dayObj.entries.length; j++) {
                    const e = dayObj.entries[j];
                    bars += '<div class="timeline-bar" style="left: ' + ((e.start_min/1440)*100) + '%; width: ' + ((e.duration/1440)*100) + '%;"></div>';
                }
                row.innerHTML = `<div class="week-row-meta"><span>${formatDayDate(dateStr)}</span><span>${formatHours(dayObj.total_minutes)}</span></div><div class="timeline-track">${bars}</div>`;
                wrapper.appendChild(row);
            }
        }

        function renderDayView() {
            if(dates.length === 0) return;
            const data = logData[dates[currentDayIndex]];
            document.getElementById('day-title').innerText = formatDayDate(dates[currentDayIndex]);
            
            let maxCatTime = 0;
            for (let cat in data.categories) if (data.categories[cat] > maxCatTime) maxCatTime = data.categories[cat];
            
            let catHtml = '<div class="category-bars">';
            for (let cat in data.categories) {
                catHtml += `<div class="cat-row"><div class="cat-label">${cat}</div><div class="bar-bg"><div class="bar-fill" style="width: ${(data.categories[cat] / maxCatTime) * 100}%;"></div></div><div class="cat-time">${formatHours(data.categories[cat])}</div></div>`;
            }
            document.getElementById('day-categories-wrapper').innerHTML = catHtml + '</div>';

            let entriesHtml = '';
            for(let i=0; i<data.entries.length; i++) {
                let e = data.entries[i];
                entriesHtml += `<div class="entry-card"><div class="entry-card-header"><span>${e.category}</span><span>${e.start} - ${e.end}</span></div><div class="entry-card-desc">${e.desc}</div></div>`;
            }
            document.getElementById('day-entries-wrapper').innerHTML = entriesHtml;
            document.getElementById('btn-prev').disabled = currentDayIndex === 0;
            document.getElementById('btn-next').disabled = currentDayIndex === dates.length - 1;
        }

        function changeDay(dir) {
            let nextIdx = currentDayIndex + dir;
            if(nextIdx >= 0 && nextIdx < dates.length) { currentDayIndex = nextIdx; renderDayView(); updateDynamicCounter('day'); }
        }

        initWeekTimeline();
        renderDayView();
    </script>
    </body>
    </html>
